<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Photo Gallery</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
  #image {
    width: 600px; max-width: 100%; height: 400px; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #333; color: #fff; font-size: 1.4rem;
    background-color: #555; background-size: cover; background-position: center;
    background-repeat: no-repeat; background-image: url('');
  }
  .preview { width: 150px; height: 100px; object-fit: cover; margin: 5px; cursor: pointer; border: 2px solid #ccc; }
  .preview:hover, .preview:focus { border-color: #333; }
</style>
</head>
<body>
  <h1>Interactive Photo Gallery</h1>

  <div id="image">Hover over an image below to display here.</div>

  <div>
    <img class="preview" src="https://picsum.photos/id/1015/600/400" alt="River valley"
         onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()" tabindex="0">
    <img class="preview" src="https://picsum.photos/id/1018/600/400" alt="Mountain meadow"
         onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()" tabindex="0">
    <img class="preview" src="https://picsum.photos/id/1039/600/400" alt="Waterfall in the forest"
         onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()" tabindex="0">
    <img class="preview" src="https://picsum.photos/id/1043/600/400" alt="Quiet lake at sunrise"
         onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()" tabindex="0">
  </div>

<script>
  function upDate(previewPic) {
    console.log("upDate triggered");
    console.log("alt:", previewPic.alt, "| src:", previewPic.src);

    const imageDiv = document.getElementById("image");
    imageDiv.innerHTML = previewPic.alt;
    imageDiv.style.backgroundImage = "url('" + previewPic.src + "')";
  }

  function undo() {
    console.log("undo triggered");

    const imageDiv = document.getElementById("image");
    imageDiv.style.backgroundImage = "url('')";
    imageDiv.innerHTML = "Hover over an image below to display here.";
  }
</script>
</body>
</html>
